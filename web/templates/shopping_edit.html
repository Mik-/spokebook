{{define "title"}}{{.Item.Text}}{{end}}

{{define "content"}}
<nav aria-label="breadcrumb"><ul><li><a href="/shopping">{{t "shopping.title"}}</a></li><li>{{.Item.Text}}</li></ul></nav>
<h1>{{t "shopping.edit"}}</h1>
{{template "error" .}}
<form method="post" action="/shopping/{{.Item.ID}}">
  <label>{{t "shopping.field.text"}}<span class="req" aria-hidden="true">*</span> <input name="text" value="{{.Form.Get "text"}}" required>
  </label>
  <button type="submit">{{t "action.save"}}</button>
</form>
<div class="actions end"><a href="/shopping/{{.Item.ID}}/delete" role="button" class="outline danger">{{t "shopping.delete"}}</a></div>
{{end}}
