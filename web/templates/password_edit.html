{{define "title"}}{{t "account.password.change"}}{{end}}

{{define "content"}}
<nav aria-label="breadcrumb"><ul><li><a href="/account">{{t "account.title"}}</a></li><li>{{t "account.password.change"}}</li></ul></nav>
<h1>{{t "account.password.change"}}</h1>
{{template "error" .}}
<form method="post" action="/account/password">
  <input type="text" name="name" value="{{.User.Name}}" autocomplete="username" hidden>
  <label>{{t "account.password.current"}}<span class="req" aria-hidden="true">*</span> <input type="password" name="current_password" autocomplete="current-password" required autofocus></label>
  <div class="grid">
    <label>{{t "account.password.new"}}<span class="req" aria-hidden="true">*</span> <input type="password" name="password" autocomplete="new-password" minlength="{{.MinPassword}}" required>
      <small>{{t "auth.password.hint" .MinPassword}}</small></label>
    <label>{{t "auth.field.password_confirm"}}<span class="req" aria-hidden="true">*</span> <input type="password" name="password_confirm" autocomplete="new-password" minlength="{{.MinPassword}}" required></label>
  </div>
  <p>{{t "account.password.hint"}}</p>
  <button type="submit">{{t "action.save"}}</button>
</form>
{{end}}
