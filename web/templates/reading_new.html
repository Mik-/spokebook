{{define "title"}}{{t "bike.odometer.new"}}{{end}}

{{define "content"}}
<nav aria-label="breadcrumb"><ul><li><a href="/">{{t "bikes.title"}}</a></li><li><a href="/bikes/{{.Bike.ID}}">{{.Bike.Name}}</a></li><li>{{t "bike.odometer.new"}}</li></ul></nav>
<h1>{{t "bike.odometer.new"}}</h1>
{{template "error" .}}
<form method="post" action="/bikes/{{.Bike.ID}}/odometer">
  <div class="grid">
    <label>{{t "bike.odometer.field.date"}}<span class="req" aria-hidden="true">*</span> <input type="date" name="date" value="{{or (.Form.Get "date") .Today}}" required></label>
    <label>{{t "bike.odometer.field.km"}}<span class="req" aria-hidden="true">*</span> <input type="number" name="km" min="0" step="0.1" inputmode="decimal" value="{{.Form.Get "km"}}" required autofocus></label>
  </div>
  <button type="submit">{{t "bike.odometer.add"}}</button>
</form>
{{end}}
